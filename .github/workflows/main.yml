name: Update Submodules and Release zhTW

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force Update'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Check for submodule updates
        run: |
          git submodule update --progress --init --force --remote
          UPDATED=$(git status --porcelain)
          if [ -n "$UPDATED" ] || [ "${{ github.event.inputs.force_update }}" = "true" ]; then
            echo "updated=true" >> $GITHUB_ENV
          else
            echo "updated=false" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        if: env.updated == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install pnpm
        if: env.updated == 'true'
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9

      - name: Setup Python
        if: env.updated == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: env.updated == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt opencc-python-reimplemented

      - name: Update Localization
        if: env.updated == 'true'
        run: |
          cd GakumasPreTranslation
          cp .env.sample .env
          pnpm install
          pnpm ts-node main.ts

      - name: Get game resources
        if: env.updated == 'true'
        uses: actions/checkout@v4
        with:
          repository: DreamGallery/Campus-adv-txts
          ref: main
          path: Campus_adv_txts

      - name: Copy txt to raw
        if: env.updated == 'true'
        run: |
          rm -rf ./raw
          mkdir -p ./raw
          cp -r Campus_adv_txts/Resource/adv* ./raw

      - name: Merge Resources
        if: env.updated == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python merge.py

      - name: Build zhTW package
        if: env.updated == 'true'
        run: |
          python build_zhtw.py

      - name: Increment version
        if: env.updated == 'true'
        run: |
          VERSION=$(cat version.txt | sed 's/v//')
          NEW_VERSION="v$(echo $VERSION | awk -F. '{ $NF++; printf "%d.%d.%d", $1, $2, $3 }')"
          echo "Current VERSION: $VERSION"
          echo "New VERSION: $NEW_VERSION"
          echo $NEW_VERSION > version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Release
        if: env.updated == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: GakumasTranslationData_zhTW.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: zhTW-${{ env.NEW_VERSION }}
          name: zhTW-${{ env.NEW_VERSION }}
          body: |
            Traditional Chinese package release

            Asset:
            - GakumasTranslationData_zhTW.zip
          allowUpdates: true
          replacesArtifacts: true

      - name: Commit and Push Changes
        if: env.updated == 'true'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add .
          git commit -m "Update submodules and version.txt to ${{ env.NEW_VERSION }}" || echo "No changes to commit"
          git push
